spring:
  application:
    name: westart
  data:
    redis:
      url: redis://127.0.0.1:6379
  datasource:
    url: jdbc:mysql://localhost:3306/westart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: westart
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  threads:
    virtual:
      enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

logging:
  level:
    com.github.wechat.ilink.sdk.ILinkClient: WARN


westart:
  wechat:
    login-state-encryption-key: ${WECHAT_LOGIN_STATE_ENCRYPTION_KEY:}
  memory:
    redis-key-prefix: "westart:chat-memory:"
    chat-ttl: 3h
    max-tokens: 50000
    history-stream-key: "westart:stream:chat-history"
    history-consumer-group: "westart-chat-history-group"
    history-batch-size: 20
    history-token-threshold: 8000
    history-max-wait: 1m
    history-poll-interval: 5s
    history-idle-timeout: 15s
    history-pending-timeout: 1m
    history-max-delivery-attempts: 3
    history-dead-letter-stream-key: "stream:history:deadletter"

app:
  temp:
    images:
      dir: ./temp/images

mcp:
  servers:
    flyai:
      name: 飞猪
      description: >-
        提供旅行服务查询能力，包括机票、酒店、景点、目的地和旅行方案的搜索、比较与推荐，可返回实时价格、可订选项和预订链接。适用于查询航班、住宿、景点信息以及规划综合旅行行程。
      enabled: true
      transport: streamable-http
      url: https://flyai.open.fliggy.com/mcp
      auth-type: flyai
      api-key: ${FLYAI_API_KEY}
      log-requests: false
      log-responses: false

    luckin:
      name: 瑞幸
      description: >-
        提供瑞幸咖啡门店定位、饮品和商品查询、规格与加料选择、购物车及订单创建能力。适用于查找附近瑞幸门店、选择咖啡饮品并完成瑞幸点单流程。
      enabled: true
      transport: streamable-http
      url: https://gwmcp.lkcoffee.com/order/user/mcp
      auth-type: bearer
      api-key: ${LUCKIN_API_KEY}
      log-requests: false
      log-responses: false

