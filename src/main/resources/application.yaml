spring:
  application:
    name: westart
  data:
    redis:
      url: redis://127.0.0.1:6379
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://localhost:3306/westart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  threads:
    virtual:
      enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
    druid:
      # 初始连接数
      initial-size: 5
      # 最小空闲连接数
      min-idle: 5
      # 最大活跃连接数
      max-active: 20
      # 获取连接最大等待时间(ms)，超时抛异常
      max-wait: 60000
      # 检测间隔(ms)，检测需要关闭的空闲连接
      time-between-eviction-runs-millis: 60000
      # 连接最小生存时间(ms)
      min-evictable-idle-time-millis: 300000
      # 验证查询SQL
      validation-query: SELECT 1
      # 申请连接时检测（建议true，保证可用性）
      test-on-borrow: false
      # 归还连接时检测
      test-on-return: false
      # 空闲时检测（推荐开启）
      test-while-idle: true
      # 是否缓存PreparedStatement
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
    wall:
      config:
        multi-statement-allow: false  # 防SQL注入：禁止多语句执行

logging:
  level:
    com.github.wechat.ilink.sdk.ILinkClient: WARN


westart:
  wechat:
    login-state-encryption-key: ${WECHAT_LOGIN_STATE_ENCRYPTION_KEY:}
  memory:
    redis-key-prefix: "westart:chat-memory:"
    chat-ttl: 3h
    max-tokens: 50000
    history-stream-key: "westart:stream:chat-history"
    history-consumer-group: "westart-chat-history-group"
    history-batch-size: 10
    history-token-threshold: 8000
    history-max-wait: 1m
    history-poll-interval: 2s
    history-idle-timeout: 10m
    history-pending-timeout: 1m
    history-max-delivery-attempts: 3
    history-dead-letter-stream-key: "stream:history:deadletter"

app:
  temp:
    images:
      dir: ./temp/images

aliyun:
  oss:
    # Endpoint（外网，本地开发用）
    endpoint: https://oss-cn-beijing.aliyuncs.com

    # Bucket 名称
    bucket-name: westart

    # AccessKey（强烈建议从环境变量读取，不要硬编码！）
    access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
    access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}

    # 上传文件的基础路径前缀
    base-path: uploads/

    # 预签名 URL 默认有效期（秒）
    presigned-url-expiration: 3600

    # 允许上传的文件类型
    allowed-file-types:
      - image/jpeg
      - image/png
      - image/gif
      - application/pdf

    # 单文件最大大小（字节），默认 10MB
    max-file-size: 10485760*5

mcp:
  servers:
    flyai:
      name: 飞猪
      description: >-
        提供旅行服务查询能力，包括机票、酒店、景点、目的地和旅行方案的搜索、比较与推荐，可返回实时价格、可订选项和预订链接。适用于查询航班、住宿、景点信息以及规划综合旅行行程。
      enabled: true
      transport: streamable-http
      url: https://flyai.open.fliggy.com/mcp
      auth-type: flyai
      api-key: ${FLYAI_API_KEY}
      log-requests: false
      log-responses: false

    luckin:
      name: 瑞幸
      description: >-
        提供瑞幸咖啡门店定位、饮品和商品查询、规格与加料选择、购物车及订单创建能力。适用于查找附近瑞幸门店、选择咖啡饮品并完成瑞幸点单流程。
      enabled: true
      transport: streamable-http
      url: https://gwmcp.lkcoffee.com/order/user/mcp
      auth-type: bearer
      api-key: ${LUCKIN_API_KEY}
      log-requests: false
      log-responses: false
    hsr:
      name: 12306
      description: >-
        提供中国铁路出行查询能力，包括火车站信息、列车时刻、车次经停站、票价、余票和换乘方案查询。适用于规划国内火车和高铁行程，不处理飞机或酒店查询。
      enabled: true
      transport: streamable-http
      url: http://localhost:8000/mcp
      auth-type: none
      api-key: ${MODEL_SCOPE}
      log-requests: false
      log-responses: false
    mc:
      name: 麦当劳
      description: >-
        提供麦当劳门店定位、菜单和商品查询、规格选择、购物车及订单创建能力。适用于查找附近麦当劳门店、选择汉堡套餐、饮品和其他商品并完成麦当劳点餐流程。
      enabled: true
      transport: streamable-http
      url: https://mcp.mcd.cn
      auth-type: bearer
      api-key: ${MC_API_KEY}
      log-requests: false
      log-responses: false

    slideforge:
      name: SlideForge
      description: >-
        提供PowerPoint演示文稿制作能力，可根据文字或结构化内容创建单页幻灯片和完整演示文稿，查询版式与主题、上传素材、翻译演示文稿并返回可编辑的PPTX文件和预览图。
      enabled: true
      transport: streamable-http
      url: https://api.slideforge.dev/mcp/
      auth-type: bearer
      log-requests: false
      log-responses: false
      api-key: ${SLIDEFORGE_API_KEY}

    tuniu-flight:
      name: 途牛机票
      description: >-
        提供国内航班搜索、舱位价格查询和在线预订能力。适用于查询航班时刻、票价、舱位，
        以及完成机票下单。流程：搜索航班 → 查询舱位详情 → 创建订单 → 支付。
        下单需要用户主动提供乘机人姓名、证件信息、手机号；下单成功后必须提醒用户点击支付链接完成支付。
      enabled: true
      transport: streamable-http
      url: https://openapi.tuniu.cn/mcp/flight
      auth-type: apikey
      api-key: ${TUNIU_API_KEY}
      log-requests: false
      log-responses: false

    tuniu-holiday:
      name: 途牛度假
      description: >-
        提供度假产品（跟团游、自助游、自驾游、当地游等）搜索、产品详情与团期价格日历查询、
        在线预订能力。适用于查询旅游线路、团期和价格，以及完成度假产品下单。
        流程：搜索产品 → 查看详情与团期 → 选择出发日期 → 创建订单。
        下单需要用户主动提供出游人姓名、证件信息、手机号。
      enabled: true
      transport: streamable-http
      url: https://openapi.tuniu.cn/mcp/holiday
      auth-type: apikey
      api-key: ${TUNIU_API_KEY}
      log-requests: false
      log-responses: false

    tuniu-hotel:
      name: 途牛酒店
      description: >-
        提供酒店搜索、酒店详情与房型报价查询、在线预订能力。适用于查询城市酒店、房型、
        价格，以及完成酒店下单。流程：搜索酒店 → 查看房型报价 → 创建订单 → 支付。
        下单需要用户主动提供入住人姓名、手机号。
      enabled: true
      transport: streamable-http
      url: https://openapi.tuniu.cn/mcp/hotel
      auth-type: apikey
      api-key: ${TUNIU_API_KEY}
      log-requests: false
      log-responses: false

    tuniu-ticket:
      name: 途牛门票
      description: >-
        提供景点门票查询和在线预订能力。适用于查询景点门票价格、票型，以及完成门票下单。
        流程：查询门票 → 创建订单 → 支付。下单需要用户主动提供取票人与出游人姓名、
        证件信息、手机号。
      enabled: true
      transport: streamable-http
      url: https://openapi.tuniu.cn/mcp/ticket
      auth-type: apikey
      api-key: ${TUNIU_API_KEY}
      log-requests: false
      log-responses: false

    tuniu-train:
      name: 途牛火车票
      description: >-
        提供火车票车次列表搜索、车次详情与坐席价格查询、在线预订能力。适用于查询车次、
        余票、坐席价格，以及完成火车票下单。流程：搜索车次 → 查询坐席详情 → 创建订单 → 支付。
        下单需要用户主动提供乘车人姓名、证件信息、手机号。
      enabled: true
      transport: streamable-http
      url: https://openapi.tuniu.cn/mcp/train
      auth-type: apikey
      api-key: ${TUNIU_API_KEY}
      log-requests: false
      log-responses: false

    rollinggo:
      name: RollingGo
      description: >-
        提供全球酒店查询能力，包括按目的地和日期搜索酒店、按价格与设施筛选、查询酒店详情、房型、实时价格和可订状态。仅用于酒店住宿，不处理机票、火车票或景点查询。
      enabled: true
      transport: streamable-http
      url: https://mcp.rollinggo.cn/mcp
      auth-type: bearer
      log-requests: false
      log-responses: false
      api-key: ${ROLLING_GO}
