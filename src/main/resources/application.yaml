spring:
  application:
    name: westart
  data:
    redis:
      url: redis://127.0.0.1:6379
  datasource:
    url: jdbc:mysql://localhost:3306/westart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: ${PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  threads:
    virtual:
      enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://127.0.0.1:6379}
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/westart?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: westart
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

westart:
  memory:
    redis-key-prefix: "westart:chat-memory:"
    chat-ttl: 3h
    max-tokens: 50000
    history-stream-key: "westart:stream:chat-history"
    history-consumer-group: "westart-chat-history-group"
    history-batch-size: 20
    history-max-wait: 1m
    history-poll-interval: 5s
    history-pending-timeout: 1m
    history-max-delivery-attempts: 3
    history-dead-letter-stream-key: "stream:history:deadletter"



app:
  temp:
    images:
      dir: ./temp/images

mcp:
  servers:
    flyai:
      name: 飞猪
      enabled: true
      transport: streamable-http
      url: https://flyai.open.fliggy.com/mcp
      auth-type: flyai
      api-key: ${FLYAI_API_KEY}
      log-requests: false
      log-responses: false

    luckin:
      name: 瑞幸
      enabled: true
      transport: streamable-http
      url: https://gwmcp.lkcoffee.com/order/user/mcp
      auth-type: bearer
      api-key: ${LUCKIN_API_KEY}
      log-requests: false
      log-responses: false

    mc:
      name: 麦当劳
      enabled: true
      transport: streamable-http
      url: https://mcp.mcd.cn
      auth-type: bearer
      api-key: ${MC_API_KEY}
      log-requests: false
      log-responses: false

    slideforge:
      name: SlideForge
      enabled: true
      transport: streamable-http
      url: https://api.slideforge.dev/mcp/
      auth-type: bearer
      log-requests: false
      log-responses: false
      api-key: ${SLIDEFORGE_API_KEY}
