    hsr:
      name: 12306
      description: >-
        提供中国铁路出行查询能力，包括火车站信息、列车时刻、车次经停站、票价、余票和换乘方案查询。适用于规划国内火车和高铁行程，不处理飞机或酒店查询。
      enabled: true
      transport: streamable-http
      url: http://localhost:8000/mcp
      auth-type: none
      api-key: ${MODEL_SCOPE}
      log-requests: false
      log-responses: false
    mc:
      name: 麦当劳
      description: >-
        提供麦当劳门店定位、菜单和商品查询、规格选择、购物车及订单创建能力。适用于查找附近麦当劳门店、选择汉堡套餐、饮品和其他商品并完成麦当劳点餐流程。
      enabled: true
      transport: streamable-http
      url: https://mcp.mcd.cn
      auth-type: bearer
      api-key: ${MC_API_KEY}
      log-requests: false
      log-responses: false

    slideforge:
      name: SlideForge
      description: >-
        提供PowerPoint演示文稿制作能力，可根据文字或结构化内容创建单页幻灯片和完整演示文稿，查询版式与主题、上传素材、翻译演示文稿并返回可编辑的PPTX文件和预览图。
      enabled: true
      transport: streamable-http
      url: https://api.slideforge.dev/mcp/
      auth-type: bearer
      log-requests: false
      log-responses: false
      api-key: ${SLIDEFORGE_API_KEY}

    rollinggo:
      name: RollingGo
      description: >-
        提供全球酒店查询能力，包括按目的地和日期搜索酒店、按价格与设施筛选、查询酒店详情、房型、实时价格和可订状态。仅用于酒店住宿，不处理机票、火车票或景点查询。
      enabled: true
      transport: streamable-http
      url: https://mcp.rollinggo.cn/mcp
      auth-type: bearer
      log-requests: false
      log-responses: false
      api-key: ${ROLLING_GO}
