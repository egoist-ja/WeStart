spring:
  application:
    name: westart
  data:
    redis:
      url: redis://127.0.0.1:6379
  datasource:
    url: jdbc:mysql://localhost:3306/westart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: ${PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  threads:
    virtual:
      enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000


westart:
  memory:
    redis-key-prefix: "westart:chat-memory:"
    chat-ttl: 3h
    max-tokens: 50000
    history-stream-key: "westart:stream:chat-history"
    history-consumer-group: "westart-chat-history-group"
    history-batch-size: 20
    history-token-threshold: 8000
    history-max-wait: 1m
    history-poll-interval: 5s
    history-idle-timeout: 15s
    history-pending-timeout: 1m
    history-max-delivery-attempts: 3
    history-dead-letter-stream-key: "stream:history:deadletter"

app:
  temp:
    images:
      dir: ./temp/images

mcp:
  servers:
    flyai:
      name: 飞猪
      enabled: true
      transport: streamable-http
      url: https://flyai.open.fliggy.com/mcp
      auth-type: flyai
      api-key: ${FLYAI_API_KEY}
      log-requests: false
      log-responses: false

    luckin:
      name: 瑞幸
